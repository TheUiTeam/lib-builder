name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn eslint 'src/**/*.ts'
      - run: yarn jest
      - run: npm pack --dry-run --ignore-scripts

  # the record: every push to master saves one, and a pull request compares against it
  variance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # the review diffs the change from the commit the record was made at
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - id: carry
        run: yarn -s variance carry restore --format github >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.carry.outputs.suite-unit-path }}
          key: ${{ steps.carry.outputs.suite-unit-key }}
          restore-keys: ${{ steps.carry.outputs.suite-unit-restore-keys }}
      - if: steps.carry.outputs.pushed-key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.carry.outputs.pushed-path }}
          key: ${{ steps.carry.outputs.pushed-key }}
          restore-keys: ${{ steps.carry.outputs.pushed-restore-keys }}
      # sets the mainline's record aside, so the review compares against it and not the last push
      - id: take
        run: yarn -s variance carry take --format github >> "$GITHUB_OUTPUT"
      - run: yarn -s jest
      - if: ${{ !cancelled() }}
        run: yarn -s variance index
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ steps.carry.outputs.base }}
          OUT: ${{ steps.carry.outputs.review }}
          AGAINST: ${{ steps.take.outputs.against-unit }}
        run: |
          yarn -s variance review --since "$BASE" --suite unit --coverage ${AGAINST:+--against "$AGAINST"} --out "$OUT" --format markdown > "$RUNNER_TEMP/review.md"
          cat "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: variance-review
          path: ${{ steps.carry.outputs.review }}
      # a fork's token cannot comment; the step summary and the artifact still hold the review
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file "$RUNNER_TEMP/review.md" --edit-last --create-if-none
      - if: github.event_name == 'push'
        env:
          AGAINST: ${{ steps.take.outputs.against-unit }}
        run: yarn -s variance coverage --suite unit ${AGAINST:+--against "$AGAINST"} >> "$GITHUB_STEP_SUMMARY"
      - id: save
        if: ${{ !cancelled() }}
        run: yarn -s variance carry save --format github >> "$GITHUB_OUTPUT"
      - if: ${{ success() && steps.save.outputs.suite-unit-key != '' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.save.outputs.suite-unit-path }}
          key: ${{ steps.save.outputs.suite-unit-key }}
      - if: ${{ !cancelled() && steps.save.outputs.pushed-key != '' }}
        run: yarn -s variance carry keep
      - if: ${{ !cancelled() && steps.save.outputs.pushed-key != '' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.save.outputs.pushed-path }}
          key: ${{ steps.save.outputs.pushed-key }}
