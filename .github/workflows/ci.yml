name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn eslint 'src/**/*.ts'
      - run: yarn jest
      - run: npm pack --dry-run --ignore-scripts

  variance:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the checkout, and the badge
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the review reads the change from where it starts
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the CLI needs 22.15 or newer
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: Variance-Authority/action/review@v1
        with:
          suite: unit
          test: yarn jest
          badge: 'true'
