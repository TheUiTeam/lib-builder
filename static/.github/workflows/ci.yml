name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # __PNPM_SETUP__
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: __MANAGER__
      - run: __INSTALL__
      - run: __RUN__ build
      - run: __RUN__ test:ci
      - name: Check the packed entry points
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e '
            const [{ files }] = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const packed = new Set(files.map((file) => file.path));
            const { main, module, types } = require("./package.json");
            const missing = [main, module, types].filter(
              (entry) => entry && !packed.has(entry.replace(/^\.\//, "")),
            );
            if (missing.length) throw new Error("not in the package: " + missing);
          '
